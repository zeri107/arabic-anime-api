<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أنمي هيفن | النسخة العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-body: #f8fafc; --bg-surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
    --primary: #2563eb; --accent: #f59e0b; --danger: #ef4444;
    --border: #e2e8f0; --radius-md: 16px; --radius-lg: 24px;
    --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05); --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; transition: background .25s, color .25s; }
  body.dark { --bg-body:#0f172a; --bg-surface:#1e293b; --text-main:#f8fafc; --text-muted:#94a3b8; --border:#334155; }
  
  .top-nav { position: sticky; top: 0; height: 70px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 1000; border-bottom: 1px solid var(--border); }
  body.dark .top-nav { background: rgba(15,23,42,.95); }
  .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; gap:10px; align-items:center;}
  .nav-actions { display:flex; gap:8px; }
  .icon-btn, .filter-btn { border:1px solid var(--border); background:var(--bg-surface); color:var(--text-main); border-radius:10px; padding:9px 12px; cursor:pointer; }
  .filter-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  
  .container { max-width: 1450px; margin: 0 auto; padding: 20px; }
  .hero { background:linear-gradient(135deg,#1d4ed8,#7c3aed); color:#fff; border-radius:24px; padding:32px 28px; margin-bottom:24px; box-shadow:0 18px 40px rgba(37,99,235,.22); }
  .hero h1 { font-size:clamp(26px,4vw,42px); margin-bottom:8px; }
  .hero p { opacity:.9; font-size:16px; }
  .section-title { display:flex; align-items:center; justify-content:space-between; margin:18px 0 14px; }
  .section-title h2 { font-size:22px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
  .chip { white-space:nowrap; border:1px solid var(--border); background:var(--bg-surface); color:var(--text-main); border-radius:999px; padding:9px 14px; cursor:pointer; }
  .chip:hover { border-color:var(--primary); color:var(--primary); }
  .search-box { width: 100%; max-width: 500px; margin: 0 auto 30px; position: relative; }
  .search-box input { width: 100%; padding: 15px 20px 15px 50px; border-radius: 50px; border: 1px solid var(--border); font-size: 16px; outline: none; background: var(--bg-surface); color:var(--text-main); }
  .search-box button { position: absolute; left: 5px; top: 5px; bottom: 5px; width: 40px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; }
  .quick-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:-12px auto 24px; }

  .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 22px; }
  .anime-card { background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.3s; border: 1px solid var(--border); }
  .anime-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
  .card-img { width: 100%; height: 300px; object-fit: cover; }
  .card-title { padding: 15px; font-size: 15px; font-weight: 800; text-align: center; line-height:1.4; white-space: nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-footer { display:flex; justify-content:space-between; align-items:center; padding:0 12px 12px; color:var(--text-muted); font-size:12px; }
  .fav-btn { border:0; background:none; color:var(--text-muted); cursor:pointer; font-size:18px; }
  .fav-btn.saved { color:var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 15px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--bg-surface); width: 100%; max-width: 900px; max-height: 95vh; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
  
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
  .ep-btn { padding: 15px 10px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 8px; font-weight: 800; text-align: center; cursor: pointer; transition: 0.2s; font-size: 15px; }
  .ep-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .ep-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .ep-btn.available::after { content:'  • تشغيل'; color:#16a34a; font-size:11px; }
  body.dark .ep-btn.available::after { color:#86efac; }

  .video-container { display: none; margin-bottom: 20px; background: #000; border-radius: var(--radius-md); overflow: hidden; position: relative; width: 100%; aspect-ratio: 16/9; }
  .video-container video { width: 100%; height: 100%; display: block; }
  .video-container iframe { width: 100%; height: 100%; border: none; display: block; }
  .player-tools { display:none; gap:8px; flex-wrap:wrap; align-items:center; padding:10px; background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; }
  .player-tools select, .player-tools a { padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-body); color:var(--text-main); text-decoration:none; }
  .player-loading { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: white; font-weight: 800; font-size: 18px; z-index: 10; }

  .loader { display: none; text-align: center; padding: 50px; font-size: 20px; font-weight: bold; color: var(--primary); }
  .loader i { font-size: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="top-nav">
  <a href="#" class="logo"><i class="fas fa-tv"></i> أنمي هيفن</a>
  <div class="nav-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="الوضع الليلي"><i id="themeIcon" class="fas fa-moon"></i></button>
    <button class="icon-btn" onclick="showFavorites()" title="المفضلة"><i class="fas fa-star"></i></button>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>اكتشف عالم الأنمي</h1>
    <p>فهرس واسع للأنميات مع بوسترات كبيرة، بحث سريع، مفضلة، وحلقاتك المضافة يدويًا.</p>
  </section>
  <div class="section-title"><h2>تصفح سريع</h2></div>
  <div class="chips">
    <button class="chip" onclick="quickSearch('Naruto')">ناروتو</button>
    <button class="chip" onclick="quickSearch('One Piece')">ون بيس</button>
    <button class="chip" onclick="quickSearch('Attack on Titan')">هجوم العمالقة</button>
    <button class="chip" onclick="quickSearch('Demon Slayer')">قاتل الشياطين</button>
    <button class="chip" onclick="quickSearch('Jujutsu Kaisen')">جوجوتسو كايسن</button>
    <button class="chip" onclick="quickSearch('Comedy anime')">كوميديا</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن أنمي (مثلاً: ناروتو، ون بيس)..." onkeypress="handleKeyPress(event)">
    <button onclick="searchAnime()"><i class="fas fa-search"></i></button>
  </div>
  <div class="quick-actions">
    <button class="filter-btn" id="historyBtn" onclick="showSearchHistory()"><i class="fas fa-history"></i> آخر عمليات البحث</button>
    <button class="filter-btn" onclick="clearResults()"><i class="fas fa-trash"></i> مسح النتائج</button>
  </div>

  <div id="loader" class="loader"><i class="fas fa-spinner"></i><br>جاري البحث في المحرك...<br><span style="font-size:14px; color:var(--text-muted);">(قد يستغرق دقيقة إذا كان السيرفر نائماً)</span></div>

  <div class="anime-grid" id="animeGrid">
    <div style="grid-column: 1/-1; text-align:center; color:var(--text-muted);">اكتب اسم أنمي في الأعلى واضغط بحث للبدء.</div>
  </div>
</div>

<div class="modal-overlay" id="episodesModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle" style="color:var(--primary);">قائمة الحلقات</h3>
      <button onclick="closeModal()" style="border:none; background:none; font-size:24px; cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="video-container" id="videoContainer">
        <div class="player-loading" id="playerLoading"><i class="fas fa-spinner fa-spin"></i> جاري جلب الفيديو...</div>
        <div id="playerWrapper"></div>
      </div>
      <div class="player-tools" id="playerTools"></div>
      <div id="modalLoader" class="loader" style="display:none; padding:20px;"><i class="fas fa-spinner"></i> جاري جلب الحلقات...</div>
      <div class="ep-grid" id="episodesList"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://arabic-anime-api.onrender.com";
  let currentAnimeId = "";
  let currentSource = "";
  let lastResults = [];
  let favoriteOnly = false;
  const favorites = JSON.parse(localStorage.getItem('animeFavorites') || '[]');
  const searchHistory = JSON.parse(localStorage.getItem('animeSearchHistory') || '[]');
  if (localStorage.getItem('animeTheme') === 'dark') document.body.classList.add('dark');

  async function fetchAPI(endpoint) {
    const res = await fetch(`${API_URL}${endpoint}`);
    if (!res.ok) throw new Error("API Error");
    return await res.json();
  }

  async function searchAnime() {
    const query = document.getElementById('searchInput').value.trim();
    if(!query) return alert("اكتب اسم الأنمي أولاً!");
    
    const grid = document.getElementById('animeGrid');
    const loader = document.getElementById('loader');
    grid.innerHTML = '';
    loader.style.display = 'block';

    try {
      const data = await fetchAPI(`/search?q=${encodeURIComponent(query)}`);
      loader.style.display = 'none';
      const results = data.results || [];
      lastResults = results;
      if (!searchHistory.includes(query)) searchHistory.unshift(query);
      localStorage.setItem('animeSearchHistory', JSON.stringify(searchHistory.slice(0, 8)));

      if (results.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; font-size:18px; color:var(--danger);">لم يتم العثور على نتائج. تأكد من كتابة الاسم بشكل صحيح.</div>';
        return;
      }

      renderResults(results);
    } catch (error) {
      loader.style.display = 'none';
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--danger); font-weight:bold;">خطأ في الاتصال. (السيرفر ينام ويحتاج 50 ثانية ليستيقظ، جرب البحث مرة أخرى).</div>';
    }
  }

  function renderResults(results) {
    const grid = document.getElementById('animeGrid');
    const shown = favoriteOnly ? results.filter(a => favorites.some(f => f.id === String(a.id) && f.source === a.source)) : results;
    if (!shown.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:30px;">لا توجد نتائج في هذا القسم.</div>';
      return;
    }
    grid.innerHTML = shown.map(anime => {
      const img = anime.poster || 'https://placehold.co/400x600/2563eb/ffffff?text=Anime';
      const saved = favorites.some(f => f.id === String(anime.id) && f.source === anime.source);
      const title = String(anime.title || 'بدون عنوان').replace(/'/g, "\\'").replace(/`/g, '\\`');
      return `<div class="anime-card" onclick="getEpisodes('${anime.id}', '${title}', '${anime.source}')">
        <img class="card-img" src="${img}" alt="${anime.title}" onerror="this.src='https://placehold.co/400x600/2563eb/ffffff?text=Anime'">
        <div class="card-title">${anime.title}</div>
        <div class="card-footer"><span>${anime.source === 'anilist' ? 'AniList' : 'مصدر خارجي'}</span>
          <button class="fav-btn ${saved ? 'saved' : ''}" onclick="toggleFavorite(event, '${anime.id}', '${title}', '${anime.source}', '${img}')" title="المفضلة"><i class="fas fa-star"></i></button>
        </div>
      </div>`;
    }).join('');
  }

  async function getEpisodes(animeId, animeTitle, source) {
    currentAnimeId = animeId;
    currentSource = source;
    
    document.getElementById('episodesModal').classList.add('active');
    document.getElementById('modalTitle').innerText = animeTitle;
    document.getElementById('episodesList').innerHTML = '';
    document.getElementById('videoContainer').style.display = 'none';
    document.getElementById('modalLoader').style.display = 'block';

    try {
      const data = await fetchAPI(`/episodes/${source}/${animeId}`);
      document.getElementById('modalLoader').style.display = 'none';
      const episodes = data.episodes || [];

      if (data.notice && source === 'anilist') {
        document.getElementById('episodesList').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:15px;">${data.notice}</div>`;
      }

      if (episodes.length === 0) {
        document.getElementById('episodesList').innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">لا توجد حلقات متاحة لهذا الأنمي (قد يكون فيلماً).</div>';
        return;
      }

      const epGrid = document.getElementById('episodesList');
      episodes.forEach((ep) => {
        epGrid.innerHTML += `
          <div class="ep-btn ${ep.available ? 'available' : ''}" onclick="playEpisode('${ep.number}', '${ep.url || ''}', this)">
            الحلقة ${ep.number}
          </div>
        `;
      });
      } catch (error) {
        document.getElementById('modalLoader').style.display = 'none';
        document.getElementById('episodesList').innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">حدث خطأ في جلب الحلقات.</div>';
    }
  }

  async function playEpisode(epNum, epUrl, btnElement, serverName = '', quality = '') {
    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    const container = document.getElementById('videoContainer');
    const wrapper = document.getElementById('playerWrapper');
    const loading = document.getElementById('playerLoading');
    container.style.display = 'block';
    loading.style.display = 'flex';
    wrapper.innerHTML = '';
    try {
      const params = new URLSearchParams();
      if (serverName) params.set('server', serverName);
      if (quality) params.set('quality', quality);
      const suffix = params.toString() ? `?${params.toString()}` : '';
      const data = await fetchAPI(`/watch/${currentSource}/${currentAnimeId}/${encodeURIComponent(epNum)}${suffix}`);
      if (!data.video_url) {
        loading.style.display = 'none';
        document.getElementById('playerTools').style.display = 'none';
        alert(data.error || 'لا يوجد رابط فيديو لهذه الحلقة.');
        return;
      }
      renderPlayerTools(epNum, data);
      if (data.type === 'iframe') {
        wrapper.innerHTML = `<iframe src="${data.video_url}" allowfullscreen="true" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
        loading.style.display = 'none';
      } else {
        const tracks = (data.subtitles || []).map(s => `<track kind="subtitles" src="${s.url}" srclang="${s.srclang || 'ar'}" label="${s.label || 'العربية'}" ${s.default ? 'default' : ''}>`).join('');
        wrapper.innerHTML = `<video id="mainPlayer" controls playsinline autoplay crossorigin>${tracks}</video>`;
        const player = document.getElementById('mainPlayer');
        player.src = data.video_url;
        player.addEventListener('canplay', () => { loading.style.display = 'none'; }, { once:true });
        player.play().catch(() => { loading.style.display = 'none'; });
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (error) {
      loading.style.display = 'none';
      alert('حدث خطأ أثناء تشغيل الحلقة.');
    }
  }

  function renderPlayerTools(epNum, data) {
    const tools = document.getElementById('playerTools');
    const servers = data.servers || [];
    const qualities = [...new Set(servers.map(s => s.quality).filter(Boolean))];
    const serverOptions = servers.map(s => `<option value="${s.name}">${s.name} — ${s.quality}</option>`).join('');
    const qualityOptions = qualities.map(q => `<option value="${q}">${q}</option>`).join('');
    const download = data.download ? `<a href="${data.video_url}" download target="_blank" rel="noopener"><i class="fas fa-download"></i> تحميل</a>` : '';
    tools.innerHTML = `<label>السيرفر <select id="serverSelect">${serverOptions}</select></label>
      <label>الجودة <select id="qualitySelect"><option value="">تلقائي</option>${qualityOptions}</select></label>
      ${data.subtitles?.length ? '<span><i class="fas fa-closed-captioning"></i> الترجمة العربية متاحة</span>' : ''}${download}`;
    tools.style.display = 'flex';
    document.getElementById('serverSelect')?.addEventListener('change', e => playEpisode(epNum, '', null, e.target.value, document.getElementById('qualitySelect').value));
    document.getElementById('qualitySelect')?.addEventListener('change', e => playEpisode(epNum, '', null, document.getElementById('serverSelect').value, e.target.value));
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    localStorage.setItem('animeTheme', dark ? 'dark' : 'light');
    document.getElementById('themeIcon').className = dark ? 'fas fa-sun' : 'fas fa-moon';
  }

  function quickSearch(query) {
    document.getElementById('searchInput').value = query;
    searchAnime();
  }

  function toggleFavorite(event, id, title, source, poster) {
    event.stopPropagation();
    const index = favorites.findIndex(f => f.id === String(id) && f.source === source);
    if (index >= 0) favorites.splice(index, 1);
    else favorites.push({ id: String(id), title, source, poster });
    localStorage.setItem('animeFavorites', JSON.stringify(favorites));
    renderResults(lastResults);
  }

  function showFavorites() {
    favoriteOnly = !favoriteOnly;
    document.getElementById('historyBtn').classList.toggle('active', favoriteOnly);
    renderResults(lastResults.length ? lastResults : favorites);
  }

  function showSearchHistory() {
    if (!searchHistory.length) return alert('لا يوجد سجل بحث حتى الآن.');
    const choice = prompt('آخر عمليات البحث:\n' + searchHistory.map((item, i) => `${i + 1}. ${item}`).join('\n') + '\n\nاكتب رقمًا للبحث:');
    const index = Number(choice) - 1;
    if (Number.isInteger(index) && searchHistory[index]) {
      document.getElementById('searchInput').value = searchHistory[index];
      searchAnime();
    }
  }

  function clearResults() {
    document.getElementById('animeGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:30px;">اكتب اسم أنمي في الأعلى واضغط بحث للبدء.</div>';
    document.getElementById('searchInput').value = '';
    lastResults = [];
    favoriteOnly = false;
  }

  function handleKeyPress(e) { if (e.key === 'Enter') searchAnime(); }
  function closeModal() {
    document.getElementById('episodesModal').classList.remove('active');
    document.getElementById('playerWrapper').innerHTML = ''; 
  }
  document.getElementById('episodesModal').addEventListener('click', e => {
    if (e.target.id === 'episodesModal') closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
